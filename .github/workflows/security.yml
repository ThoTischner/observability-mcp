name: Security scan

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    strategy:
      # One red package must not cancel the others: a fail-fast cancel
      # hides whether the sibling lockfiles are clean too.
      fail-fast: false
      matrix:
        # Branch protection requires job-name 'npm-audit (mcp-server)' and
        # 'npm-audit (agent)' — keep the short names stable across repo
        # refactors by mapping a friendly name to its path.
        # Every lockfile that ships to users is listed: the server, the
        # published SDK and the connectors with npm dependencies.
        include:
          - name: mcp-server
            path: mcp-server
          - name: agent
            path: examples/agent
          - name: sdk
            path: packages/sdk
          - name: connector-aws
            path: connectors/aws
          - name: connector-gcp
            path: connectors/gcp
    name: npm-audit (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '20'
      - name: Ensure lockfile exists (${{ matrix.path }})
        # Both mcp-server and examples/agent DO commit a package-lock.json
        # (the agent's Dockerfile runs `npm ci`, which requires one), so this
        # audits the exact tree we ship — the honest thing to do. This step
        # is only a fallback for a hypothetical lockfile-less path: it
        # resolve-only-generates one (--package-lock-only --ignore-scripts,
        # nothing installed) so `npm audit` always has something to read.
        # NOTE: it deliberately does NOT refresh an existing lockfile —
        # auditing a freshly-reresolved tree would hide the drift between
        # what we pinned and what's currently vulnerable. When audit fails on
        # a committed lockfile, the fix is to bump the override floor to the
        # patched version and regenerate the lockfile, not to auto-refresh here.
        working-directory: ./${{ matrix.path }}
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
      - name: npm audit (${{ matrix.path }})
        # Wrapper, not bare `npm audit`: it retries a 503 from npmjs.org's
        # advisory endpoint (which reddened the 2026-09-04 nightly for
        # 7m11s without a single vulnerability being involved) while still
        # failing hard on any real advisory. Exit 2 == endpoint unreachable,
        # exit 1 == vulnerabilities found. See scripts/npm-audit-ci.mjs.
        run: node scripts/npm-audit-ci.mjs ${{ matrix.path }} --level high

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '20'
      - name: Install
        working-directory: ./mcp-server
        run: npm ci
      - name: Run tests
        working-directory: ./mcp-server
        # Connectors use a directory glob, not a list of file names: the old
        # hand-maintained list named 4 of 13 files, so loki.test.ts (and with
        # it the aggregate tests that would have caught #611), prometheus,
        # kubernetes, tls, topology, registry, loader and manifest-hooks
        # never ran in CI. A new *.test.ts there is now picked up by itself.
        run: npx tsx --test src/analysis/*.test.ts src/config/*.test.ts src/sdk/*.test.ts src/auth/*.test.ts src/auth/oidc/*.test.ts src/auth/policy/*.test.ts src/tenancy/*.test.ts src/products/*.test.ts src/audit/*.test.ts src/catalog/*.test.ts src/policy/*.test.ts src/quota/*.test.ts src/connectors/*.test.ts src/cli/*.test.ts src/tools/*.test.ts src/net/*.test.ts src/openapi.test.ts src/enterprise-gate.test.ts
      - name: Connector hub catalog (validate + in-sync)
        run: |
          node hub/build-catalog.mjs --check
          node --test hub/build-catalog.test.mjs
      - name: Audit-verifier CLI (end-to-end)
        run: node --test scripts/verify-audit.test.mjs
      - name: npm-audit CI wrapper (end-to-end)
        run: node --test scripts/npm-audit-ci.test.mjs
      - name: SDK connector scaffold (end-to-end)
        run: node --test scripts/sdk-scaffold.test.mjs
      - name: IP-enrich CSV converter CLI (end-to-end)
        run: node --test scripts/build-ip-enrich-csv.test.mjs
      - name: Connectors (tests + manifest/catalog integrity in sync)
        run: |
          node --test connectors/*/*.test.mjs connectors/*/contract/*.test.mjs
          node -e '
            const c=require("crypto"),fs=require("fs"),p=require("path");
            for (const d of fs.readdirSync("connectors",{withFileTypes:true})) {
              if (!d.isDirectory()) continue;
              const dir="connectors/"+d.name;
              const pkg=JSON.parse(fs.readFileSync(p.join(dir,"package.json")));
              if (pkg.observabilityMcp?.kind!=="connector") continue;
              const i="sha256-"+c.createHash("sha256").update(fs.readFileSync(p.join(dir,"index.js"))).digest("base64");
              const m=JSON.parse(fs.readFileSync(p.join(dir,"manifest.json")));
              if(m.integrity!==i){console.error(d.name+": manifest.integrity stale "+m.integrity+" != "+i);process.exit(1)}
              const cat=JSON.parse(fs.readFileSync("hub/catalog/"+d.name+".json"));
              if(cat.versions[0].integrity!==i){console.error(d.name+": catalog integrity stale");process.exit(1)}
              console.log(d.name+" integrity in sync");
            }
          '
      - name: Connector packer tests
        run: node --test connectors/pack.test.mjs

  trivy:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./mcp-server
          push: false
          load: true
          tags: observability-mcp:scan
      - name: Run Trivy on image
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # master
        with:
          image-ref: observability-mcp:scan
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
      - name: Upload Trivy FS SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      # The SARIF steps above report everything (incl. unfixed) to the
      # Security tab but never fail. These gates do: any HIGH/CRITICAL
      # finding that already has a fix — in the shipped image or in any
      # lockfile in the repo — turns the job red.
      - name: Gate — image has no fixable HIGH/CRITICAL
        if: always()
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # master
        with:
          image-ref: observability-mcp:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Gate — repository has no fixable HIGH/CRITICAL
        if: always()
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      # Misconfiguration scan (Dockerfiles, Helm chart, k8s manifests).
      # The whole repo is reported to the Security tab; the gate covers
      # what ships — the Helm chart and the server/bundle Dockerfiles —
      # minus the reviewed exceptions in .trivyignore.yaml.
      - name: Trivy config scan
        if: always()
        uses: aquasecurity/trivy-action@6abccf398f78b4c337599c0656f933d91efb91a0 # master
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          # LOW/MEDIUM hardening hints on demo/test manifests would bury
          # the Security tab; report what's worth acting on.
          severity: CRITICAL,HIGH
          exit-code: '0'
      - name: Upload Trivy config SARIF
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        if: always()
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config
      - name: Gate — shipped chart and Dockerfiles have no HIGH/CRITICAL misconfiguration
        if: always()
        uses: aquasecurity/trivy-action@6abccf398f78b4c337599c0656f933d91efb91a0 # master
        with:
          scan-type: config
          scan-ref: .
          skip-dirs: examples,tests,.github,mcp-server/playwright
          trivyignores: .trivyignore.yaml
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

  base-image-freshness:
    # Trivy matches OS packages and npm lockfiles, not the Node runtime
    # baked into the base image — a digest pinned months ago ships an old
    # Node silently (it sat on 26.1.0 while 26.12.1 was current). Compare
    # the Node version in every pinned base image with what its tag
    # serves today. Nightly only: upstream releases must not block PRs.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pinned node base images match their tag's current Node
        run: |
          for f in $(git ls-files '*Dockerfile*'); do
            grep -oE '^FROM node:[^@ ]+@sha256:[0-9a-f]{64}' "$f" | sed 's/^FROM //' | sort -u | while read -r ref; do
              tag=${ref%@*}
              pinned=$(docker run --rm "$ref" node -v)
              current=$(docker run --rm --pull always "$tag" node -v)
              if [ "$pinned" = "$current" ]; then
                echo "ok    $f: $tag $pinned"
              else
                echo "::error file=$f::$tag is pinned to Node $pinned, the tag now serves $current — refresh the digest"
                echo stale >> /tmp/stale
              fi
            done
          done
          [ ! -s /tmp/stale ]
