name: Tag on release merge

# When a "chore(release): vX.Y.Z" commit lands on main (typically via the
# PR opened by auto-release.yml), create and push the matching tag. The
# tag push then triggers release.yml, docker-publish.yml, and
# npm-publish.yml. Tag refs are not blocked by branch protection on main.

on:
  push:
    branches: [main]
    paths:
      - mcp-server/package.json

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    # The tag is pushed with RELEASE_PAT, not GITHUB_TOKEN: GitHub does not
    # start workflows for pushes made with GITHUB_TOKEN, so a tag pushed
    # that way would never fan out to release/npm/docker/helm. Hence no
    # write scope for GITHUB_TOKEN, and no silent fallback to it.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          # The push below authenticates with RELEASE_PAT explicitly; a
          # persisted GITHUB_TOKEN header would take precedence over it.
          persist-credentials: false

      - name: Check commit message and create tag
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          msg=$(git log -1 --pretty=%s)
          echo "head subject: $msg"
          # Tolerates the "(#NN)" suffix that GitHub appends when the
          # release PR is squash-merged.
          if ! [[ "$msg" =~ ^chore\(release\):[[:space:]]+v([0-9]+\.[0-9]+\.[0-9]+)([[:space:]]+\(\#[0-9]+\))?$ ]]; then
            echo "not a release commit, skipping"
            exit 0
          fi
          version="v${BASH_REMATCH[1]}"

          # Sanity: the package.json must agree with the commit subject.
          pkg_version=$(node -p "require('./mcp-server/package.json').version")
          if [ "v$pkg_version" != "$version" ]; then
            echo "commit subject ($version) does not match package.json (v$pkg_version)"
            exit 1
          fi

          # Don't re-tag if it already exists.
          if git rev-parse "$version" >/dev/null 2>&1; then
            echo "tag $version already exists, skipping"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only real release commits need the PAT, so a missing secret
          # can't redden ordinary pushes.
          if [ -z "$RELEASE_PAT" ]; then
            echo "::error::RELEASE_PAT is not set. A tag pushed with GITHUB_TOKEN would not trigger the release workflows."
            exit 1
          fi
          git tag -a "$version" -m "Release $version"
          git push "https://x-access-token:${RELEASE_PAT}@github.com/${GITHUB_REPOSITORY}.git" "$version"
          echo "pushed tag $version"
