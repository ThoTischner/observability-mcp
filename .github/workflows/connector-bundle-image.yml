name: Publish plugins bundle image

# Builds and pushes the official multi-connector plugins OCI image to
# GHCR: ghcr.io/<repo>-plugins. The Helm chart's plugins.image can point
# straight at it (init-container extracts the requested connectors) — no
# hand-built image, and it doubles as the airgapped "bundled image".
#
# Connectors are packed + signed with the SAME pack.mjs + signing key as
# the per-connector hub tarballs (fail-open if the key is absent).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Also tag the bundle with this release version (e.g. 3.9.15) — backfill only'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'connectors/**'
      - '.github/workflows/connector-bundle-image.yml'
    # v* = server release: the chart pins plugins.image to the bundle
    # tagged with its appVersion, so every release gets its own bundle.
    tags: ['connector-*', 'v*']

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '20'

      - name: Validate backfill version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Must match Chart.yaml appVersion exactly (no leading "v").
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::version must look like 3.9.15 (no leading v), got '$VERSION'"; exit 1; }

      - name: Image name (lowercase) + restore signing key
        id: prep
        env:
          KEY_B64: ${{ secrets.PLUGIN_SIGNING_KEY_B64 }}
        run: |
          set -euo pipefail
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-plugins" >> "$GITHUB_OUTPUT"
          if [ -n "${KEY_B64:-}" ]; then
            echo "$KEY_B64" | base64 -d > /tmp/plugin-signing.key
            chmod 600 /tmp/plugin-signing.key
            echo "key=/tmp/plugin-signing.key" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::PLUGIN_SIGNING_KEY_B64 unset — bundle ships UNSIGNED."
            echo "key=" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage signed plugins
        run: |
          if [ -n "${{ steps.prep.outputs.key }}" ]; then
            sh connectors/build-bundle.sh /tmp/bundle "${{ steps.prep.outputs.key }}"
          else
            sh connectors/build-bundle.sh /tmp/bundle
          fi

      - name: Wipe signing key
        if: always()
        run: shred -u /tmp/plugin-signing.key 2>/dev/null || rm -f /tmp/plugin-signing.key

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.prep.outputs.image }}
          # :latest only follows main (the rule below); a release tag build
          # must not move it as a side effect of the semver rule.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=sha
            type=raw,value=bundle

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: /tmp/bundle
          file: /tmp/bundle/Dockerfile.bundle
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
