---
apiVersion: v1
kind: Namespace
metadata:
  name: omcp-it
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omcp-it-echo
  namespace: omcp-it
spec:
  replicas: 2
  selector:
    matchLabels:
      app: omcp-it-echo
  template:
    metadata:
      labels:
        app: omcp-it-echo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: echo
          image: ealen/echo-server:0.9.2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            # Unprivileged port: the container runs as non-root.
            - name: PORT
              value: "8080"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
