# Accepted Trivy misconfiguration findings for the artefacts the
# security scan gates on (helm chart, server + bundle Dockerfiles).
# Every entry needs a reason; anything not listed here fails CI.

misconfigurations:
  - id: KSV-0014
    paths:
      - helm/observability-mcp/templates/deployment.yaml
    statement: >-
      mcp-server writes to its filesystem by design when persistence is off
      (Web UI source edits under /app/config, /tmp, audit/profile files), so
      readOnlyRootFilesystem stays opt-in via values.securityContext. The
      extract-plugins init container is read-only unconditionally.

  - id: KSV-0013
    paths:
      - helm/observability-mcp/templates/deployment.yaml
    statement: >-
      The connector bundle image (plugins.image) is only published as
      :latest / :sha-* / :bundle, with no version tag to pin by default yet.
      Operators pin it via plugins.image; airgapped installs mirror it.

  - id: KSV-0125
    statement: >-
      "Trusted registries" is a per-cluster admission policy (ghcr.io is the
      project's own registry); not something the chart can satisfy.
